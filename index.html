<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T — Typing Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<body>
  <!-- ...existing content... -->
  <header class="wrap header">
    <div class="brand">T</div>
    <div class="actions">
      <button id="themeToggle" aria-label="Toggle theme">Dark</button>
      <button id="restart" class="primary">Restart</button>
    </div>
  </header>

  <main class="wrap">
    <section class="board" aria-live="polite">
      <div id="prompt" class="prompt" role="region" aria-label="Typing prompt"></div>
      <div class="input-row">
        <input id="hiddenInput" class="hidden-input" autocomplete="off" autocapitalize="none" spellcheck="false" />
        <button id="focusBtn" class="ghost" aria-label="Focus typing">Tap to type</button>
      </div>
    </section>

    <section class="stats" aria-label="Live stats">
      <div class="stat">
        <div class="label">Time</div>
        <div class="value"><span id="time">60</span>s</div>
      </div>
      <div class="stat">
        <div class="label">WPM</div>
        <div class="value" id="wpm">0</div>
      </div>
      <div class="stat">
        <div class="label">Accuracy</div>
        <div class="value" id="accuracy">100%</div>
      </div>
      <div class="stat">
        <div class="label">Chars</div>
        <div class="value"><span id="correct">0</span>/<span id="total">0</span></div>
      </div>
    </section>
  </main>

  <footer class="wrap footer">
    <div>Simple, clean typing test. Press any key to start.</div>
  </footer>

    }
  }
  </script>
